# Deploys the public/ folder to InfinityFree (solat.site.je) over FTP on every push to main.
#
# One-time setup in GitHub → Settings → Secrets and variables → Actions:
#   Secrets:   FTP_USERNAME  (e.g. if0_12345678 — InfinityFree client area → the hosting account → "FTP Details")
#              FTP_PASSWORD  (that hosting account's password, not the client-area login)
#   Variables: FTP_SERVER_DIR = /solat.site.je/htdocs/ (the domain is an add-on domain on the account that
#              also hosts TeamBoard at /htdocs/, so this must never be left at the default)
#
# scripts/set-github-secrets.ps1 can create the two secrets for you.
# Until the secrets exist the upload step is skipped and the run stays green.
name: Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Syntax check the front end
        run: node --check public/assets/app.js

      - name: Secrets missing?
        if: env.FTP_USERNAME == '' || env.FTP_PASSWORD == ''
        run: |
          echo "::warning::FTP_USERNAME / FTP_PASSWORD secrets are not set — skipping the upload. See README → Deploy to InfinityFree."

      - name: Upload via FTP
        if: env.FTP_USERNAME != '' && env.FTP_PASSWORD != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          port: 21
          protocol: ftp
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/htdocs/' }}
          exclude: |
            **/.gitkeep
